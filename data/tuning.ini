; Edit this file in the installed profile on robot1-x, or edit here and deploy.
; Changes reload while playing (about once a second). 1.0 = original strength.
[graphics]
saturation_multiplier = 0.95
contrast_multiplier = 1.15
fog_density_multiplier = 0.20

; Offsets are fractions of the full viewport height: positive moves DOWN.
; 0.08 = down 8 percent; -0.10 = up 10 percent; 0 = original position.
[hud]
dialogue_offset_y = -0.10
boss_health_offset_y = 0.15
mission_info_offset_y = 0.15
compass_offset_y = 0.15

; Fixed HUD groups: health, ammo, spells/cooldowns, party, level/currency and hints.
; Size independent of automatic eye-aspect correction; 1.0 = native size.
scale_multiplier = 0.85
; 1 fixes vertical stretching from the VR projection; 0 disables this correction.
aspect_correction = 1
; Minimum inset at each edge, fractions of full width/height; 0 = no extra inset.
; Setting both margins on an axis to 0 restores native placement on that axis.
left_margin = 0.20
right_margin = 0.20
top_margin = 0.15
bottom_margin = 0.30

[aim]
; 0 = unfiltered; 1 = strongest stabilization. Faster sweeps reduce the added lag.
; Affects controller aiming; head tracking and snap turns stay immediate.
stabilization = 0.35

[cursor]
; Menu arrow only: preserve its native size and proportions in screen mode.
scale_multiplier = 1.0
; Optional immersive projection correction; leave off for the normal menu cursor.
aspect_correction = 0

; Monitoring uses the same HUD margins above to flag edge candidates.
[audit]
; Record up to one hour on each launch/reset. 0 disables automatic capture.
auto_start = 1
